pre-commit:
  parallel: true
  commands:
    lint-fix:
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      skip:
        - run: test "$NO_TEST" -eq 1
      run: pnpm exec tsc --noEmit

pre-push:
  commands:
    test:
      run: pnpm test
